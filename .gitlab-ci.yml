stages:
  - code_quality
  - test
  - deploy

# Shared setup for every Python job: an image with Python 3.11 + uv,
# dependencies installed from the lock file, uv cache kept between pipelines.
.python:
  image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
  variables:
    UV_CACHE_DIR: .uv-cache
    UV_LINK_MODE: copy
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache
  before_script:
    - uv sync --frozen

pylint:
  extends: .python
  stage: code_quality
  script:
    # Fails the job (and the pipeline) if the score is below 10/10.
    - uv run pylint --fail-under=10 main.py test_main.py

run-test:
  extends: .python
  stage: test
  script:
    - uv run pytest -v --junitxml=report.xml
  artifacts:
    when: always
    paths:
      - report.xml
    reports:
      junit: report.xml
    expire_in: 1 week

calculate-coverage:
  extends: .python
  stage: test
  script:
    - uv run pytest -v --cov=. --cov-report term --cov-report xml:coverage.xml --cov-report html
  # Extracts the TOTAL percentage from the job log so GitLab shows it in the UI.
  coverage: '/TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    paths:
      - coverage.xml
      - htmlcov/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week

# Continuous deployment to Render: only on main, only after code_quality and
# test passed. RENDER_DEPLOY_HOOK_URL is a masked CI/CD variable.
deploy-render:
  stage: deploy
  image: curlimages/curl:8.11.1
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $RENDER_DEPLOY_HOOK_URL
  script:
    - curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"
  environment:
    name: production
